name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: landscaper
    steps:
      - name: Check out Landscaper
        uses: actions/checkout@v4
        with:
          path: landscaper
          persist-credentials: false

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -cnotmatch '^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Release tags must be X.Y.Z or vX.Y.Z.'
          }
          $version = $env:TAG_NAME -creplace '^v', ''
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri\Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($package.version -ne $version -or $tauri.version -ne $version -or $cargoVersion -ne $version) {
            throw "Tag version $version must match package.json, src-tauri\tauri.conf.json, and src-tauri\Cargo.toml."
          }

      - name: Check out sibling Rust dependency
        uses: actions/checkout@v4
        with:
          repository: maciej-trebacz/ff7-lib.rs
          ref: da8c7dcea110d21641daebe05c0a017d3a18103d
          path: ff7-lib
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landscaper\package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: landscaper\src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build unsigned Windows installer
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'tauri-ci.conf.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $config -Encoding utf8
          npm run tauri build -- --ci --target x86_64-pc-windows-msvc --config $config -- --locked

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: landscaper\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: installers

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $installers = @(Get-ChildItem installers -Filter *.exe -File)
          if ($installers.Count -eq 0) {
            throw 'No Windows installers were downloaded.'
          }
          gh release create $env:TAG_NAME @($installers.FullName) --verify-tag --title "FF7 Landscaper $env:TAG_NAME" --generate-notes
